#
# The test half of the lint boundary (docs/rust-port.md, Lint Boundary). clippy reads the
# clippy.toml nearest to a crate's manifest, so this file, not the root one, governs the meta crate:
# the meta-tests read the tree, run git and cargo, and write scratch crates by design, so none of the
# production I/O or clock bans applies here. meta/tests/lint_inheritance.rs keeps it that way.

allow-unwrap-in-tests = true
allow-expect-in-tests = true

doc-valid-idents = ["BitGauge", "OpenMetrics", ".."]
