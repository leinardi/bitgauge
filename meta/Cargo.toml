[package]
name = "meta"
version = "0.0.0"
description = "Repository meta-tests for BitGauge"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The repository checks the meta-tests run (rust-common's repo-meta, which also gives the
# repository and its Dockerfile reader), the configuration loader of the deployments test, and
# the parsers of the YAML, JSON and TOML files the tests read.
[dependencies]
bitgauge = { path = ".." }
regex = "1.13.1"
repo-meta.workspace = true
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
toml = "1.1.8"

# The scratch crates and workspaces of the negative controls, and the tool gate the gated tests
# look their tools up through (testenv::toolgate).
[dev-dependencies]
testenv = { path = "../testenv" }
tempfile = "3.27.0"
