---
failure-threshold: style
# A missing label is only info by default, which failure-threshold would let through.
override:
  error:
    - DL3049
ignored:
  # Pin versions in apk add. Kept for test/harness/tools.Dockerfile, whose Alpine base is pinned
  # by digest, which fixes the package set more tightly than version pins would.
  - DL3018
# The seven OCI labels of build-packaging.md section 1, each required (DL3049 when missing) and
# validated; strict-labels rejects any label not listed here.
label-schema:
  org.opencontainers.image.title: text
  org.opencontainers.image.description: text
  org.opencontainers.image.source: url
  org.opencontainers.image.version: text
  org.opencontainers.image.revision: text
  org.opencontainers.image.created: text
  org.opencontainers.image.licenses: spdx
strict-labels: true
