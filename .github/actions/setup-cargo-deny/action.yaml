name: "Set up cargo-deny"
description: >-
  Installs the cargo-deny release binary that make rust-deny and make audit-deps run, verified
  against its published digest, so every job checks the dependency graph with the same release.

runs:
  using: "composite"
  steps:
    # The one pin of cargo-deny in the repository; the digest is the release asset's .sha256, from
    # https://github.com/EmbarkStudios/cargo-deny/releases/download/<version>/. Bump both together.
    - name: Install cargo-deny
      shell: bash
      env:
        CARGO_DENY_VERSION: 0.20.2
        CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      run: |
        set -euo pipefail
        release="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
        archive="${RUNNER_TEMP}/${release}.tar.gz"
        curl -fsSL -o "${archive}" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${release}.tar.gz"
        echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict -
        tar -xzf "${archive}" -C "${RUNNER_TEMP}"
        sudo install -m 0755 "${RUNNER_TEMP}/${release}/cargo-deny" /usr/local/bin/cargo-deny
        cargo deny --version
