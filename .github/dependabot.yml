version: 2

registries:
  dhi:
    type: docker-registry
    url: https://dhi.io
    # Dependabot sees only Dependabot secrets, not Actions variables (docs/release.md, setup step 2).
    username: ${{ secrets.DHI_USERNAME }}
    password: ${{ secrets.DHI_TOKEN }}
    replaces-base: false

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it (GitHub's default is
    # 3 days), so a broken or compromised release has time to be yanked.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  # The base images of the shipped image (build-packaging.md section 1). They are pinned by tag, not
  # by digest: dhi.io republishes its tags with security fixes and every build takes them, so this
  # ecosystem only moves the tags themselves. Tag bumps are chore(deps) and bump no version: they
  # ship with the next release, and one that carries a security fix is released with an explicit
  # version (the Versioning section of docs/release.md).
  - package-ecosystem: "docker"
    directory: "/deployments/docker"
    registries: ["dhi"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    ignore:
      # The web stage stays on a Node LTS line, the single Node line meta/tests/toolchain.rs
      # holds every file to. Dependabot cannot tell an LTS line from a Current one, so the line is
      # capped here: once a newer even line reaches LTS, move every file by hand and raise this cap
      # with them. The tag floats within its line, so patch releases still arrive.
      - dependency-name: "node"
        versions: [">= 25"]
      # The build stage's Rust release is rust-toolchain.toml's, and meta/tests/toolchain.rs holds
      # the image tag, rust-toolchain.toml, the Cargo rust-version and the rust-std pins to one
      # release, so a bump of the tag alone could only fail. Move them together, by hand.
      - dependency-name: "rust"
    groups:
      docker-base-images:
        patterns:
          - "*"

  # The Rust workspace. fix, not chore: the release version is derived from commit types, so a
  # dependency bump (security fixes included) produces a patch release. The server's
  # dev-dependencies ship nothing, so they are chore(deps); the meta and testenv crates' own
  # dependencies count as regular ones here, a patch release more than needed, never one less.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      cargo:
        patterns:
          - "*"

  # The SPA, embedded in the binary and the image. Its runtime dependencies ship, so they are
  # fix(deps); devDependencies (lint, test and build tooling) are chore(deps) and bump nothing.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    # TypeScript stays on the 5.x line: openapi-typescript peers on typescript ^5.x and
    # typescript-eslint on <6.1.0, so a newer major makes npm ci fail with ERESOLVE and blocks the
    # whole web group. Raise this cap once both accept the newer line.
    ignore:
      - dependency-name: "typescript"
        versions: [">= 6"]
      # The Node types follow the Node line the web stage runs, which meta/tests/toolchain.rs holds
      # every file to (the docker entry above caps "node" the same way). Raise both caps together,
      # by hand, when the line moves.
      - dependency-name: "@types/node"
        versions: [">= 25"]
    groups:
      web:
        patterns:
          - "*"
