name: Go unit tests

# Reusable: CI calls it for pull requests and pushes (restore only) and go-cache-warmup calls it on
# main (restore and save). GitHub only lets a pull request read caches saved on its own ref or on
# the default branch, so main is where the shared build and test cache has to come from.
on:
  workflow_call:
    inputs:
      save-cache:
        description: Save the Go build and test cache after the run.
        type: boolean
        default: false

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Track the newest patch of the Go line in .go-version rather than go.mod, whose directive is
      # a language floor that dependencies may raise to an exact patch and would pin every job to
      # whatever release that happens to be.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Locate Go caches
        id: go-env
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      # actions/setup-go only restores an exact go.sum match, so every dependency bump would start
      # cold. The prefix fallbacks let it start from the newest main cache and rebuild only what
      # changed; GOCACHE also carries test results, so unchanged packages report (cached).
      #
      # The last fallback drops the Go version: a Dependabot bump can rewrite the go.mod directive
      # to a full patch version, and the version-qualified keys would then miss on exactly the pull
      # requests that need the cache most. Entries built by another toolchain are keyed by build ID
      # and simply go unused, while the module cache carries over intact.
      - name: Restore Go cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Run unit tests
        run: go test -race ./...

      - name: Save Go cache
        if: ${{ inputs.save-cache && !cancelled() && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
