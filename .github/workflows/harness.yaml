name: Accuracy harness

# The accuracy harness's CI tier (testing.md section 5): every CI profile on Chromium, Firefox and
# WebKit, judged against the iperf3 reference, behind netguard. Dispatched by hand, for every
# profile or a subset of the profiles or browsers; reusable, so a workflow can call it again.
#
# No schedule for now: this repository is private and its Actions minutes are limited. Once it is
# public, add the nightly run back (a going-public item); with empty inputs it runs the whole tier:
#
#   schedule:
#     # Every night, 03:41 UTC: off the hour, when scheduled runs pile up.
#     - cron: "41 3 * * *"
on:
  workflow_call:
    secrets:
      DHI_USERNAME:
        required: false
      DHI_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      profiles:
        description: Comma-separated CI profile names; empty runs every CI profile.
        type: string
        default: ""
      browsers:
        description: Comma-separated chromium, firefox, webkit; empty runs all three.
        type: string
        default: ""

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runners are the Rust ones (testenv, feature harness); the toolchain is the one
      # rust-toolchain.toml pins.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The client container mounts web/ with its node_modules: it has no route out to install them.
      - name: Install the web dependencies
        run: make web-install

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image under test builds on dhi.io/rust, dhi.io/node and dhi.io/static.
      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME || secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      # The shaper's ifb device, its qdiscs and its ingress mirror live in the runner's kernel.
      - name: Load the shaping modules
        run: sudo modprobe -a ifb sch_netem sch_tbf sch_fq_codel sch_ingress cls_u32 act_mirred

      # Empty inputs (every pull request and push) run every CI profile on all three browsers,
      # against the shipped image.
      - name: Run the CI tier
        env:
          HARNESS_PROFILES: ${{ inputs.profiles }}
          HARNESS_BROWSERS: ${{ inputs.browsers }}
        run: make harness-ci BITGAUGE_TEST_IMPL=rust HARNESS_TIMEOUT=120m

      - name: Summarize the report
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(dist/harness/*/report.md)
          if [[ ${#reports[@]} -eq 0 ]]; then
            echo "### No harness report was written" >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          cat "${reports[@]}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload the reports and exports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-${{ github.run_attempt }}
          path: dist/harness/
          if-no-files-found: warn
          retention-days: 14
