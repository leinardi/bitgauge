name: Go Cache Warm-up

# Keeps a main-branch Go build and test cache for pull requests to restore (see go-test.yaml).
#
# Triggered by the merges that invalidate that cache rather than by the clock, so it bills minutes
# only when main actually changed and the saved entry always matches the newest main, which is also
# what lets a pull request get cached test results back. cancel-in-progress collapses a burst of
# merges into a single run.
#
# The weekly schedule is eviction insurance, not a refresh: GitHub drops a cache nothing has read
# for 7 days, which would leave the next pull request cold after a quiet stretch.
on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - .go-version
      - go.mod
      - go.sum
      - .github/workflows/go-test.yaml
      - .github/workflows/go-cache-warmup.yaml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: go-cache-warmup
  cancel-in-progress: true

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  go-test:
    uses: ./.github/workflows/go-test.yaml
    permissions:
      contents: read
    with:
      save-cache: true

  # Each run saves a new entry keyed by commit; keep only the newest two so the repository cache
  # quota is not spent on stale builds.
  prune:
    needs: go-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Delete older Go caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --key go-test- --sort created_at --order desc --limit 100 \
            --json id --jq '.[2:][].id' |
            xargs -r -n 1 gh cache delete
