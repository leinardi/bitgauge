name: Rust

# Reusable: CI calls it for pull requests and pushes, and the release workflow calls it again at the
# commit it releases. The toolchain is the one rust-toolchain.toml pins; the Rust build cache is
# saved only on a pull request, which main's runs then restore.
on:
  workflow_call:

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  # The workspace: format, clippy over every target and feature, the tests (the meta-tests
  # included), the documentation and cargo-deny.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # What dtolnay/rust-toolchain exported to every later step of the job.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Check formatting
        run: make rust-fmt-check

      # --all-features: the code behind testenv's Docker features is linted too.
      - name: Lint with clippy
        run: make rust-clippy

      - name: Run the tests
        run: make rust-test

      - name: Check the Rust documentation
        run: make rust-doc

      - name: Set up cargo-deny
        uses: ./.github/actions/setup-cargo-deny

      # --workspace (in the make target): the root is a package as well as the workspace, so
      # without it cargo-deny would check the server's graph only, not the meta and testenv crates.
      - name: Check dependencies with cargo-deny
        run: make rust-deny

      # The shipped binary's graph alone: no test crate, no shared crate it does not ship, no
      # client, filesystem or process feature (deny-shipped.toml). Bans only, so no network.
      - name: Check the shipped graph with cargo-deny
        run: cargo deny --config deny-shipped.toml check bans

  # The release binaries, built the way release.yaml builds them: the web app, then a static musl
  # binary for each release platform with the pinned zig and cargo-zigbuild (.mk/rust-release.mk).
  # Each must carry no program interpreter and no shared library, so it runs on any Linux.
  rust-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What dtolnay/rust-toolchain exported to every later step of the job.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-static
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install zig and cargo-zigbuild
        run: |
          set -euo pipefail
          make rust-zigbuild-install RUST_RELEASE_TOOLS_DIR="${RUNNER_TEMP}/zigbuild"
          echo "${RUNNER_TEMP}/zigbuild/bin" >>"${GITHUB_PATH}"

      - name: Build the static binaries
        run: make rust-release-binaries

      - name: Check the binaries are static
        run: |
          set -euo pipefail
          cat dist/checksums.txt
          for binary in dist/bitgauge-linux-amd64 dist/bitgauge-linux-arm64; do
            if readelf -lW "${binary}" | grep -q 'Requesting program interpreter'; then
              echo "${binary} needs a program interpreter" >&2
              exit 1
            fi
            if readelf -dW "${binary}" | grep -q '(NEEDED)'; then
              echo "${binary} needs a shared library" >&2
              exit 1
            fi
          done
