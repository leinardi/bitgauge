name: CI

# The authoritative checks run on every pull request and every push to main; the reviewdog jobs only
# annotate pull requests.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  # The authoritative lint gate: every pre-commit hook over every file. The meta-tests hook is
  # skipped because repo-gates runs the meta-tests with every tool installed; cargo-test and
  # cargo-deny (which needs the network) because the rust job runs them.
  pre-commit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      # For the cargo-fmt, cargo-clippy and cargo-machete hooks. The Rust cache is saved only on a
      # pull request.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # droast's ShellCheck bridge runs the shellcheck on PATH: the pinned one, not the runner's.
      - name: Set up ShellCheck
        uses: ./.github/actions/setup-shellcheck

      # Restore only: pre-commit-warmup.yaml saves the entry on main under the same key.
      - name: Restore the pre-commit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook on every file
        env:
          SKIP: meta-tests,cargo-test,cargo-deny
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit fails a hook that modifies a tracked file, which covers the auto-fixing hooks
      # (markdownlint fix, prettier); this also fails on a file a hook creates,
      # which its diff check does not see, so no fix can pass silently.
      - name: Fail if a hook modified a file
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Reports inline PR review comments over a diff range; a push or a manual dispatch has neither a
  # pull request to comment on nor a base ref to diff against. Annotation only: pre-commit-all is
  # the gate, so none of these jobs is required.
  actionlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # droast's ShellCheck bridge runs the shellcheck on PATH: the pinned one, not the runner's.
      - name: Set up ShellCheck
        uses: ./.github/actions/setup-shellcheck

      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: |
            check-merge-conflict
            end-of-file-fixer
            trailing-whitespace
            check-yaml
            check-json
            check-toml
            check-added-large-files
            droast

  markdownlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The release version is derived from the commit types since the last tag, so a commit nobody can
  # classify is a release nobody can version. The local commit-msg hook only runs where
  # make pre-commit-install was run; this job is the check that no commit skips. It runs the
  # repository's own conventional-pre-commit hook, so --force-scope applies here too, and it skips
  # merge commits. On a push the commits were already checked on their pull request.
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # The meta-tests (the meta crate), with the tools they drive: a missing eslint or fallow fails here
  # (BITGAUGE_REQUIRE_TOOLS=1) instead of skipping.
  repo-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      # BITGAUGE_REQUIRE_TOOLS: the gated tools (testenv::toolgate) are installed here, so a test
      # that would skip for a missing one fails instead.
      - name: Run the repository meta-tests
        env:
          BITGAUGE_REQUIRE_TOOLS: "1"
        run: cargo test --locked -p meta

  # The release workflow's helper scripts, tested with a stub gh: no network, no token. They are
  # live before release.yaml exists, so a change to them is tested when it is made.
  release-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test binary-attestation-status.sh
        run: bash .github/scripts/binary-attestation-status.test.sh

      - name: Test recover-toolchains.sh
        run: bash .github/scripts/recover-toolchains.test.sh

  # The workspace checks and the static release builds, defined in rust.yaml so the release workflow
  # runs the identical jobs at the commit it releases.
  rust:
    uses: ./.github/workflows/rust.yaml
    permissions:
      contents: read

  # Defined in web.yaml so web-cache-warmup runs the identical job on main and saves the cache that
  # pull requests restore.
  web:
    uses: ./.github/workflows/web.yaml
    permissions:
      contents: read

  # cargo deny over the workspace's graph and npm audit of web/ (build-packaging.md section 4).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1

      - name: Set up cargo-deny
        uses: ./.github/actions/setup-cargo-deny

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Audit the dependencies
        run: make audit-deps

  # Decides whether this run may pull the dhi.io bases, which every image job needs
  # (docs/release.md, Required Checks and Fork Pull Requests). A pull request from a fork gets no
  # secrets: it succeeds with a notice and pull=false, so the image jobs skip and ci-result reports
  # why. Any other run is trusted, and one without the credentials is a setup error, so it fails.
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pull: ${{ steps.decide.outputs.pull }}

    steps:
      - name: Decide whether this run may pull dhi.io
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          # Dependabot runs see Dependabot secrets only, so its username is a secret there.
          HAS_USERNAME: ${{ vars.DHI_USERNAME != '' || secrets.DHI_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DHI_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == "pull_request" && "${HEAD_REPOSITORY}" != "${REPOSITORY}" ]]; then
            message="A pull request from a fork gets no dhi.io credentials, so the image jobs are skipped and ci-result fails; a maintainer merges it through a replacement pull request (docs/release.md, Required Checks and Fork Pull Requests)."
            echo "::notice title=Image jobs skipped::${message}"
            echo "### Image jobs skipped" >>"${GITHUB_STEP_SUMMARY}"
            echo "${message}" >>"${GITHUB_STEP_SUMMARY}"
            echo "pull=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${HAS_USERNAME}" != "true" || "${HAS_TOKEN}" != "true" ]]; then
            echo "::error title=No dhi.io credentials::A trusted run needs the DHI_USERNAME variable and the DHI_TOKEN secret (docs/release.md, One-Time Setup)."
            exit 1
          fi
          echo "pull=true" >>"${GITHUB_OUTPUT}"

  # The shipped image: a no-push build of both platforms, then the host-platform image into the
  # daemon and the image tests on it (testing.md section 5): user 65532, healthy, the API and the
  # SPA answering, no packet out, no write, and under strace no connection or write attempt.
  image:
    needs: credentials
    if: needs.credentials.outputs.pull == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build stages pull dhi.io/rust and dhi.io/node, the runtime stage dhi.io/static.
      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME || secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      # Both platforms build without emulation: the build stages run on the build platform and
      # cross-compile. Nothing is pushed or loaded; a failure on either platform fails here.
      - name: Build both platforms
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deployments/docker/Dockerfile \
            .

      # Builds the host-platform image as bitgauge:test, checks its identity (the Rust build at this
      # commit, holding the binary it copies out) and runs the image suite and the netguard tests.
      - name: Test the image
        run: make rust-test-image BITGAUGE_TEST_IMPL=rust

  # The accuracy harness is not part of CI: it takes up to two hours, so it runs by hand
  # (harness.yaml, workflow_dispatch, or make harness-ci) and before a release.

  # Playwright end to end (testing.md section 4): the flows on Chromium, Firefox and WebKit
  # against the binary built on the runner, so no image and no dhi.io. The browsers are cached per
  # lockfile and saved from main, where pull requests can restore them.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web dependencies
        run: make web-install

      - name: Restore the Playwright browsers
        id: browsers-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}

      # With the browsers restored, this installs only the system libraries they need.
      - name: Install the Playwright browsers
        run: npm --prefix web exec --no -- playwright install --with-deps chromium firefox webkit

      - name: Save the Playwright browsers
        if: github.ref == 'refs/heads/main' && steps.browsers-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers-restore.outputs.cache-primary-key }}

      - name: Run the end-to-end tests
        run: make e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/e2e/
          if-no-files-found: warn
          retention-days: 14

  # The one required check that stands for the rest: GitHub counts a skipped required job as passing,
  # so this job runs always and decides. On a pull request every needed job must succeed; on a push
  # or a dispatch the pull-request-only jobs are skipped and the others must succeed.
  ci-result:
    if: always()
    needs:
      - pre-commit-all
      - conventional-commits
      - repo-gates
      - release-scripts
      - rust
      - audit
      - web
      - credentials
      - image
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A fork pull request cannot pull dhi.io: its skipped image job fails with the documented
          # reason and the merge path, not as a generic skip.
          if [[ "$(jq -r '.credentials.outputs.pull // ""' <<<"${NEEDS}")" == "false" ]]; then
            echo "::error title=Fork pull request::The image jobs were skipped because a pull request from a fork gets no dhi.io credentials. Merge it through a replacement pull request (docs/release.md, Required Checks and Fork Pull Requests)."
            exit 1
          fi
          failed="$(jq -r --arg event "${EVENT}" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  $event != "pull_request"
                  and .key == "conventional-commits"
                  and .value.result == "skipped"
                ) | not
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Needed jobs did not succeed:"
            echo "${failed}"
            exit 1
          fi
          echo "Every needed job succeeded."
