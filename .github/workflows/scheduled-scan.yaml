name: Scheduled scan

# A release is scanned once, when it is built. Vulnerabilities are published every day, so the
# dependencies on main, and the image people pull once releases exist, should be scanned again
# regularly with the release's own tools and settings (docs/release.md). A failure fails the run,
# which is what makes it visible: fix it on main, and with a new release if it ships.
#
# Dispatch only for now: this repository is private and its Actions minutes are limited. Once it is
# public, add the weekly schedule back (a going-public item):
#
#   schedule:
#     # Mondays, 06:17 UTC: off the hour, when scheduled runs pile up.
#     - cron: "17 6 * * 1"
on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/leinardi/bitgauge
  PLATFORMS: linux/amd64,linux/arm64
  # Same Trivy pin as release.yaml, bumped by hand together with it.
  TRIVY_VERSION: v0.75.0

jobs:
  # The published image, each platform by its own digest, with the release's Trivy command and
  # .trivyignore (docs/release.md, Scheduled Scan).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The package is private until the repository is public, so reading it needs the token.
    permissions:
      contents: read
      packages: read

    steps:
      # For .trivyignore, the same exceptions the release scan accepts.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # :latest is resolved once, to its index digest, and both platform images are scanned by
      # their own digests: a :latest that moves during the run cannot mix two releases into one
      # result.
      - name: Scan both platform images of the latest release
        run: |
          set -euo pipefail
          INDEX=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}')
          echo "$IMAGE:latest is $(jq -r '.digest' <<<"$INDEX")"
          for platform in ${PLATFORMS//,/ }; do
            PLATFORM_DIGEST=$(jq -r --arg os "${platform%%/*}" --arg arch "${platform#*/}" \
              '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
              <<<"$INDEX")
            if [ -z "$PLATFORM_DIGEST" ]; then
              echo "$IMAGE:latest has no single $platform image." >&2
              exit 1
            fi
            echo "Scanning $platform: $PLATFORM_DIGEST"
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --platform "$platform" "$IMAGE@$PLATFORM_DIGEST"
          done

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # govulncheck over main's Go packages and npm audit over web/, as CI's audit job runs them.
      - name: Audit Go and web dependencies
        run: make audit-deps
