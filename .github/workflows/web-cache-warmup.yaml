name: Web Cache Warm-up

# Keeps a main-branch web cache for pull requests to restore (see web.yaml).
#
# Triggered by the merges that invalidate that cache rather than by the clock, so it bills minutes
# only when main actually changed. cancel-in-progress collapses a burst of merges into a single run.
#
# The weekly schedule is eviction insurance, not a refresh: GitHub drops a cache nothing has read
# for 7 days, which would leave the next pull request cold after a quiet stretch.
on:
  push:
    branches:
      - main
    paths:
      - web/**
      - api/openapi.yaml
      - .github/workflows/web.yaml
      - .github/workflows/web-cache-warmup.yaml
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

concurrency:
  group: web-cache-warmup-${{ github.ref }}
  cancel-in-progress: true

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  web:
    uses: ./.github/workflows/web.yaml
    permissions:
      contents: read
    with:
      # A dispatch from another branch runs the job but saves nothing: only main writes the cache.
      save-cache: ${{ github.ref == 'refs/heads/main' }}

  # Each run saves a new entry keyed by commit; keep only the newest two so the repository cache
  # quota is not spent on stale entries.
  prune:
    needs: web
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Delete older web caches
        uses: leinardi/gh-composite-actions/prune-caches@2115c9766c690e2e98afdeb64425c761aa86b072 # v1.4.0
        with:
          ref: refs/heads/main
          key-prefix: web-
          keep: "2"
