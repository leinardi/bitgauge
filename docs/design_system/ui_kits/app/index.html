<!doctype html>

<html lang="en" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BitGauge</title>
  <link rel="icon" href="../../assets/favicon.svg" />
  <!-- The kit is a consumer: the design system's one stylesheet, then kit-only CSS (Demo panel). -->
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="kit.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<body>
  <div id="root"></div>

  <script type="text/babel" src="TestScreen.jsx"></script>

  <script type="text/babel" src="Prototype.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>

    window.DS_READY.then(() => ReactDOM.createRoot(document.getElementById('root')).render(<App />));
  </script>

</html>
