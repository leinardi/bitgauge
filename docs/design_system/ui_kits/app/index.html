<html data-theme="dark" lang="en">

  <title>BitGauge</title>
  <link href="../../assets/favicon.svg" rel="icon" />

  <script crossorigin="anonymous"

  <script crossorigin="anonymous"

<script src="Settings.jsx" type="text/babel"></script>
<script src="About.jsx" type="text/babel"></script>
<script src="Prototype.jsx" type="text/babel"></script>
<script src="App.jsx" type="text/babel"></script>
<script type="text/babel">
