<!doctype html>
<html data-theme="dark" lang="en">
<head>
  <meta charset="utf-8">
  <link href="colors_and_type.css" rel="stylesheet">
  <style>html, body {
      margin: 0;
      padding: 0
  }

  .tile {
      width: 1280px;
      height: 854px;
      display: flex;
      overflow: hidden
  }

  .brand {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary)
  }

  .name {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 150px;
      letter-spacing: -0.03em;
      color: var(--slate-12);
      line-height: 1
  }

  .strip {
      width: 300px;
      display: flex;
      flex-direction: column
  }

  .strip span {
      flex: 1;
      display: block
  }</style>
</head>
<body>
<div class="tile">
  <div class="brand">
    <div class="name">BitGauge</div>
  </div>
  <div class="strip"><span style="background:var(--amber-5)"></span><span style="background:var(--green-5)"></span><span
      style="background:var(--violet-5)"></span><span style="background:var(--blue-6)"></span></div>
</div>
</body>
</html>
