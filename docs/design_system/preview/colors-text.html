<!-- @dsCard group="Colors" name="Text" viewport="700x160" -->
<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link href="../styles.css" rel="stylesheet">
  <link href="card.css" rel="stylesheet">
  <style></style>
</head>
<body>
<div class="lbl">Text</div>
<div class="col gap-2 mt-3">
  <div style="color:var(--fg);font-size:var(--text-base)">--fg · primary text</div>
  <div style="color:var(--fg-muted);font-size:var(--text-base)">--fg-muted · secondary text</div>
  <div style="color:var(--fg-subtle);font-size:var(--text-caption)">--fg-subtle · smallest allowed text: captions, placeholders, “—”, pending values
  </div>
  <div style="color:var(--primary-text);font-size:var(--text-base)">--primary-text · links, Edit, View, changed</div>
  <div class="row gap-2" style="font-size:var(--text-caption);color:var(--fg-subtle)"><span
      style="width:40px;height:2px;background:var(--fg-faint)"></span>--fg-faint · non-text only: ticks, dividers, icons
  </div>
</div>
</body>
</html>
