<!-- @dsCard group="Colors" name="Status triads" viewport="700x180" -->
<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link href="../styles.css" rel="stylesheet">
  <link href="card.css" rel="stylesheet">
  <style></style>
</head>
<body>
<div class="lbl">Status triads · fg / soft bg / border</div>
<div class="col gap-2 mt-3">
  <div class="row gap-3"><span class="sw" style="width:28px;height:28px;background:var(--ok)"></span><span class="pill ok"><span
      class="d"></span>ok</span><span style="font-size:var(--text-caption);color:var(--fg-muted)">Complete · saved</span></div>
  <div class="row gap-3"><span class="sw" style="width:28px;height:28px;background:var(--warn)"></span><span class="pill warn"><span class="d"></span>warn</span><span
      style="font-size:var(--text-caption);color:var(--fg-muted)">Low confidence · data cap</span></div>
  <div class="row gap-3"><span class="sw" style="width:28px;height:28px;background:var(--danger)"></span><span class="pill danger"><span
      class="d"></span>danger</span><span style="font-size:var(--text-caption);color:var(--fg-muted)">Server unreachable · failed</span></div>
  <div class="row gap-3"><span class="sw" style="width:28px;height:28px;background:var(--info)"></span><span class="pill info"><span class="d"></span>info</span><span
      style="font-size:var(--text-caption);color:var(--fg-muted)">Slow link — test extended</span></div>
</div>
</body>
</html>
