<!-- @dsCard group="Spacing" name="Spacing scale" viewport="700x200" -->
<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link href="../styles.css" rel="stylesheet">
  <link href="card.css" rel="stylesheet">
  <style></style>
</head>
<body>
<div class="lbl">Spacing · 4 px grid, 2 px dense sub-grid</div>
<div class="col gap-2 mt-3">
  <div class="row gap-3"><span class="tok" style="width:84px">--space-0-5</span><span
      style="height:10px;width:6px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span
      class="tok">2px</span></div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-1</span><span
      style="height:10px;width:12px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">4px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-1-5</span><span
      style="height:10px;width:18px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">6px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-2</span><span
      style="height:10px;width:24px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">8px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-2-5</span><span
      style="height:10px;width:30px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">10px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-3</span><span
      style="height:10px;width:36px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">12px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-3-5</span><span
      style="height:10px;width:42px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">14px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-4</span><span
      style="height:10px;width:48px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">16px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-5</span><span
      style="height:10px;width:60px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">20px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-6</span><span
      style="height:10px;width:72px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">24px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-8</span><span
      style="height:10px;width:96px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">32px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-10</span><span
      style="height:10px;width:120px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">40px</span>
  </div>
  <div class="row gap-3"><span class="tok" style="width:84px">--space-12</span><span
      style="height:10px;width:144px;background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:2px"></span><span class="tok">48px</span>
  </div>
</div>
</body>
</html>
