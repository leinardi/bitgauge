<!-- @dsCard group="Colors" name="Grade & quality bands" viewport="700x180" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="../ui_kits/app/app.css">
<script src="../ui_kits/app/bg-lib.js"></script>
<style></style>
</head><body>
<div class="lbl">Bufferbloat grade · letter is the signal, tone reinforces</div>
<div class="row wrap gap-2 mt-3"><span class="row gap-2" style="padding:var(--space-1-5) var(--space-2-5);border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--surface-2)"><b class="mono" style="color:var(--grade-good);font-size:var(--text-lg)">A+</b><span style="font-size:var(--text-caption);color:var(--fg-muted)">Minimal</span></span><span class="row gap-2" style="padding:var(--space-1-5) var(--space-2-5);border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--surface-2)"><b class="mono" style="color:var(--grade-good);font-size:var(--text-lg)">A</b><span style="font-size:var(--text-caption);color:var(--fg-muted)">Low</span></span><span class="row gap-2" style="padding:var(--space-1-5) var(--space-2-5);border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--surface-2)"><b class="mono" style="color:var(--grade-good);font-size:var(--text-lg)">B</b><span style="font-size:var(--text-caption);color:var(--fg-muted)">Mild</span></span><span class="row gap-2" style="padding:var(--space-1-5) var(--space-2-5);border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--surface-2)"><b class="mono" style="color:var(--grade-fair);font-size:var(--text-lg)">C</b><span style="font-size:var(--text-caption);color:var(--fg-muted)">Moderate</span></span><span class="row gap-2" style="padding:var(--space-1-5) var(--space-2-5);border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--surface-2)"><b class="mono" style="color:var(--grade-fair);font-size:var(--text-lg)">D</b><span style="font-size:var(--text-caption);color:var(--fg-muted)">High</span></span><span class="row gap-2" style="padding:var(--space-1-5) var(--space-2-5);border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--surface-2)"><b class="mono" style="color:var(--grade-poor);font-size:var(--text-lg)">F</b><span style="font-size:var(--text-caption);color:var(--fg-muted)">Severe</span></span></div>
<div class="lbl mt-4">Quality bands · always icon + label</div>
<div class="row wrap gap-4 mt-2"><span class="row gap-1" style="color:var(--quality-great);font-size:var(--text-sm);font-weight:var(--weight-semibold)"><bg-icon name="circle-check" size="15"></bg-icon>Great</span><span class="row gap-1" style="color:var(--quality-good);font-size:var(--text-sm);font-weight:var(--weight-semibold)"><bg-icon name="circle-check" size="15"></bg-icon>Good</span><span class="row gap-1" style="color:var(--quality-average);font-size:var(--text-sm);font-weight:var(--weight-semibold)"><bg-icon name="circle-minus" size="15"></bg-icon>Average</span><span class="row gap-1" style="color:var(--quality-poor);font-size:var(--text-sm);font-weight:var(--weight-semibold)"><bg-icon name="triangle-alert" size="15"></bg-icon>Poor</span><span class="row gap-1" style="color:var(--quality-bad);font-size:var(--text-sm);font-weight:var(--weight-semibold)"><bg-icon name="circle-x" size="15"></bg-icon>Bad</span></div>
</body></html>
