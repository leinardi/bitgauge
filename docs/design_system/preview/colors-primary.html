<!-- @dsCard group="Colors" name="Primary (teal)" viewport="700x160" -->
<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link href="../styles.css" rel="stylesheet">
  <link href="card.css" rel="stylesheet">
  <style>.g {
      display: grid;
      grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
      gap: var(--space-3);
      margin-top: var(--space-3)
  }

  .it {
      display: flex;
      flex-direction: column;
      gap: var(--space-1)
  }

  .it .sw {
      height: 52px
  }

  .nm {
      font-size: var(--text-caption);
      color: var(--fg-muted)
  }</style>
</head>
<body>
<div class="lbl">Primary · teal — actions, focus, selection, download</div>
<div class="g">
  <div class="it">
    <div class="sw" style="background:var(--teal-4)"></div>
    <span class="tok">--teal-4</span><span class="nm">hover (dark)</span></div>
  <div class="it">
    <div class="sw" style="background:var(--teal-5)"></div>
    <span class="tok">--teal-5</span><span class="nm">base (dark)</span></div>
  <div class="it">
    <div class="sw" style="background:var(--teal-6)"></div>
    <span class="tok">--teal-6</span><span class="nm">active (dark)</span></div>
  <div class="it">
    <div class="sw" style="background:var(--teal-7)"></div>
    <span class="tok">--teal-7</span></div>
</div>
<div class="row gap-3 mt-4" style="font-size:var(--text-caption)">
  <button class="btn primary sm">--primary</button>
  <span class="sw"
        style="display:inline-flex;white-space:nowrap;padding:var(--space-1-5) var(--space-3);background:var(--primary-bg);border-color:var(--primary-border);color:var(--primary-text)">--primary-bg · selected</span><span
    style="outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:var(--radius-sm);padding:2px 6px;color:var(--fg-muted)">--focus-ring · solid 2 px</span>
</div>
</body>
</html>
