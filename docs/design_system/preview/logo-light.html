<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script>/* Renders the bundle's Logo / Icon into <span data-ds="Logo|Icon" data-size=… data-name=… data-variant=…> placeholders (no Babel). */
(function () {
  const NS = 'BitGaugeDesignSystem_1ab699';
  const KEYS = ['size', 'variant', 'geometry', 'wordmark', 'wordmarkSize', 'name', 'stroke'];
  function props(el) {
    const p = {};
    for (const k of KEYS) {
      const v = el.dataset[k];
      if (v === undefined) continue;
      p[k] = v === '' ? true : /^-?\d+(\.\d+)?$/.test(v) ? +v : v;
    }
    return p;
  }
  function mount() {
    const ns = window[NS];
    if (!ns || !window.React || !window.ReactDOM) return false;
    document.querySelectorAll('[data-ds]:not([data-ds-mounted])').forEach(el => {
      const C = ns[el.dataset.ds];
      if (!C) { console.warn('preview mount: no component ' + el.dataset.ds); return; }
      el.setAttribute('data-ds-mounted', '');
      el.style.display = el.style.display || 'inline-flex';
      ReactDOM.createRoot(el).render(React.createElement(C, props(el)));
    });
    return true;
  }
  function start() {
    if (!mount()) { setTimeout(start, 50); return; }
    new MutationObserver(mount).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
