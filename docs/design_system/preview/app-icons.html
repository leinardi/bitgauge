<!-- @dsCard group="Brand" name="App icons" viewport="700x160" -->
<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link href="../styles.css" rel="stylesheet">
  <link href="card.css" rel="stylesheet">
  <style></style>
</head>
<body>
<div class="lbl">Favicons &amp; app icons · assets/</div>
<div class="row wrap gap-5 mt-3" style="align-items:flex-end">
  <div class="col gap-1" style="align-items:center"><img alt="" height="16" src="../assets/favicon-16.png" style="border-radius:0" width="16"><span
      class="tok">favicon-16.png</span></div>
  <div class="col gap-1" style="align-items:center"><img alt="" height="32" src="../assets/favicon-32.png" style="border-radius:0" width="32"><span
      class="tok">favicon-32.png</span></div>
  <div class="col gap-1" style="align-items:center"><img alt="" height="32" src="../assets/favicon.svg" style="border-radius:0" width="32"><span
      class="tok">favicon.svg</span></div>
  <div class="col gap-1" style="align-items:center"><img alt="" height="60" src="../assets/apple-touch-icon.png" style="border-radius:var(--radius-lg)"
                                                         width="60"><span class="tok">apple-touch-icon.png</span></div>
  <div class="col gap-1" style="align-items:center"><img alt="" height="72" src="../assets/icon-192.png" style="border-radius:var(--radius-lg)"
                                                         width="72"><span class="tok">icon-192.png</span></div>
  <div class="col gap-1" style="align-items:center"><img alt="" height="96" src="../assets/icon-512.png" style="border-radius:var(--radius-lg)"
                                                         width="96"><span class="tok">icon-512.png</span></div>
  <div class="col gap-1" style="align-items:center"><img alt="" height="96" src="../assets/icon-512-maskable.png" style="border-radius:var(--radius-lg)"
                                                         width="96"><span class="tok">icon-512-maskable.png</span></div>
</div>
</body>
</html>
