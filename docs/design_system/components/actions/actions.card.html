<div id="root"></div>
<script type="text/babel">
  const NS = window.BitGaugeDesignSystem_1ab699;
  const { Button, StartButton, Link, Menu, Kbd } = NS;

  function Demo() {
    const [c, setC] = React.useState("LAN");
    return <div className="col gap-3" style={{ paddingTop: 28 }}>
      <div className="row wrap gap-2" style={{ alignItems: "center" }}><StartButton role="start" /><StartButton role="stop" /><StartButton

      <div className="row wrap gap-2"><Button variant="primary" icon="play">Start test</Button><Button icon="download">Download JSON</Button><Button

      <div className="row wrap gap-3" style={{ alignItems: "center" }}><Button size="sm">Edit</Button><Button size="sm" iconOnly icon="x"

          icon="sliders">Edit</Link><Link>Why?</Link><Link external>Known browser limits</Link>
        <span className="row gap-2" style={{ alignItems: "center" }}><Kbd keys="Esc" /><Kbd keys={["/", "Ctrl+K"]} /></span>
        <Menu label="Context" value={c} icon="house" hint="suggested" selected={c} onSelect={setC}
              options={[{ value: "LAN", label: "LAN", icon: "house" }, { value: "VPN", label: "VPN", icon: "shield" }]} /></div>
    </div>;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
