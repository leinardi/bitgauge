<!-- @dsCard group="Components" viewport="700x340" name="Charts · Chart" subtitle="Live throughput with warm-up band, latency dashed on its own axis, summary label" -->
<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link href="../../styles.css" rel="stylesheet">
  <link href="../../preview/card.css" rel="stylesheet">
  <script crossorigin="anonymous"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin="anonymous"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script crossorigin="anonymous"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>html, body {
      height: auto
  }

  body {
      padding: 20px 24px
  }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.BitGaugeDesignSystem_1ab699;
  const { Chart } = NS;
  const ramp = (T, v) => Array.from({ length: T * 10 + 1 }, (_, i) => [i / 10, v * (1 - Math.exp(-i / 10 / 0.6)) * (1 + 0.05 * Math.sin(i * 1.7))]);
  const lat = Array.from({ length: 76 }, (_, i) => [i / 10, 3 + 15 * (1 - Math.exp(-i / 10))]);

  function Demo() {
    return <div className="card" style={{ padding: "var(--space-5)" }}><Chart title="Throughput" meta="7.5 s / 10 s"
                                                                              summary="Throughput: Download 590 Mbit/s, 7.5 s / 10 s; warm-up shaded"
                                                                              legend={[{
                                                                                label: "Download",
                                                                                color: "var(--series-download)"
                                                                              }, {
                                                                                label: "Latency under load",
                                                                                color: "var(--series-latency)",
                                                                                dashed: true
                                                                              }]}
                                                                              data={{
                                                                                xMax: 10,
                                                                                series: [{ pts: ramp(7.5, 600e6), color: "var(--series-download)" }],
                                                                                lat,
                                                                                now: 7.5,
                                                                                bands: [{ t0: 0, t1: 6.5 }]
                                                                              }} height={240} /></div>;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
