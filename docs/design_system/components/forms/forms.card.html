<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link href="../../styles.css" rel="stylesheet">
  <link href="../../preview/card.css" rel="stylesheet">
  <script crossorigin="anonymous"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin="anonymous"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script crossorigin="anonymous"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>html, body {
      height: auto
  }

  body {
      padding: 20px 24px
  }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.BitGaugeDesignSystem_1ab699;
  const { Input, Segmented, Switch, Toggle } = NS;

  function Demo() {
    const [m, setM] = React.useState("Auto"), [u, setU] = React.useState("Bytes"), [a, setA] = React.useState(true), [b, setB] = React.useState(false), [t, setT] = React.useState(true);
    return <div className="row" style={{ alignItems: "flex-start", gap: "var(--space-10)" }}>
      <div className="col gap-3" style={{ width: 300 }}><Input icon="tag" placeholder="Add a label" /><Input mono defaultValue="0"
                                                                                                             error="Enter 1–6 streams." /><Input
          size="sm" mono readOnly value="https://speed.home.lan/?preset=extended&streams=4" /></div>
      <div className="col gap-3"><Segmented options={["Auto", "Fixed", "Single"]} value={m} onChange={setM} /><Segmented size="sm"
                                                                                                                         options={["Bits", "Bytes"]}
                                                                                                                         value={u}
                                                                                                                         onChange={setU} /><Switch
          checked={a} onChange={setA} label="Auto-start" /><Switch checked={b} onChange={setB} label="Include label" /><Toggle pressed={t}
                                                                                                                               onChange={setT}
                                                                                                                               icon="check">Autostart</Toggle>
      </div>
    </div>;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
