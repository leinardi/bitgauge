<!-- @dsCard group="Components" viewport="700x620" name="Feedback · Notice, SaveBar, Toast, Empty, Skeleton" subtitle="Notice tones incl. neutral, save bar, toasts with undo, empty state, skeleton" -->
<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <link href="../../styles.css" rel="stylesheet">
  <link href="../../preview/card.css" rel="stylesheet">
  <script crossorigin="anonymous"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin="anonymous"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script crossorigin="anonymous"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>html, body {
      height: auto
  }

  body {
      padding: 20px 24px
  }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.BitGaugeDesignSystem_1ab699;
  const { Notice, Toast, EmptyState, SkeletonRows, Button, Link, SaveBar } = NS;

  function Demo() {
    return <div className="col gap-3">
      <Notice tone="warn" title="Low confidence — upload: insufficient samples" />
      <Notice tone="danger" icon="wifi-off" title="Server unreachable" actions={<Button size="sm" icon="refresh-cw">Retry</Button>}>speed.home.lan
        didn't answer. Check the VPN, then retry.</Notice>
      <Notice tone="neutral" title="Test cancelled during download">Latency completed. Download stopped before a 3 s steady window, so it has no
        value.</Notice>
      <Notice icon="globe" title="Firefox may limit the upload" actions={<Link external>Known browser limits</Link>}>On fast links the browser's own
        upload path can bound the upload number.</Notice>
      <SaveBar status="unsaved" title="Partial results are not saved"
               actions={<><Button size="sm" icon="history">Keep in history</Button><Button variant="ghost" size="sm" icon="file-json">Download
                 JSON</Button></>} />
      <div className="row gap-3" style={{ alignItems: "flex-start" }}><Toast animate={false} title="Summary copied." /><Toast animate={false}
                                                                                                                              tone="info" icon="trash"
                                                                                                                              title="Result deleted."
                                                                                                                              message="It is removed when this message closes."
                                                                                                                              action={<Button
                                                                                                                                  size="sm"
                                                                                                                                  icon="undo-2">Undo</Button>}
                                                                                                                              onDismiss={() => {
                                                                                                                              }} /></div>
      <div className="row gap-3" style={{ alignItems: "stretch" }}>
        <div className="card" style={{ flex: 1 }}><EmptyState style={{ padding: "var(--space-4)" }} title="No results yet"
                                                              actions={<><Button variant="primary" size="sm">Start a test</Button><Button size="sm">Import
                                                                JSON</Button></>}>Results are stored only in this browser.</EmptyState></div>
        <div className="card" style={{ flex: 1 }}><SkeletonRows rows={4} /></div>
      </div>
    </div>;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
