# One exact Rust release: the Cargo rust-version names the same one, and so does every CI step.
# Both musl targets, for the static release binaries.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
profile = "minimal"
