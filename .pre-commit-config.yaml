default_install_hook_types: [pre-commit, commit-msg]

# Hooks for gates whose inputs do not exist yet (the API types, the frontend lint, typecheck and
# test hooks) are deliberately absent: each one lands in the commit that adds its inputs, and
# test/toolchain fails both when one is missing after that point and when one appears before.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-shellcheck", "shellcheck -S error"]
      - id: actionlint
        alias: actionlint-oneline
        name: actionlint (one line per one error)
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-oneline", "-shellcheck", "shellcheck -S error"]
        stages: [manual]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        additional_dependencies:
          - markdownlint-rule-table-format@1.0.3
  # Pinned rather than taken from the system, so a developer machine and CI run the same release.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]
      - id: shellcheck
        alias: shellcheck-diff-output
        name: shellcheck (diff output)
        args: ["-f", "diff", "-x"]
        stages: [manual]
      - id: shellcheck
        alias: shellcheck-json-output
        name: shellcheck (json output)
        args: ["-f", "json", "-x"]
        stages: [manual]
  - repo: local
    hooks:
      - id: prettier-yaml
        name: prettier-yaml
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        files: \.(yml|yaml)$
        args: ["--write"]
      # The offline documentation check (AGENTS.md validation matrix): relative links and their
      # fragments resolve, and the wire facts several pages state agree.
      # -count=1 because the file list comes from git ls-files, which the test cache cannot see;
      # always_run because deleting a linked page passes no file to the hook at all.
      - id: docs-links
        name: docs links and facts
        entry: go test -count=1 ./test/docs/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Every source file carries the GPL-3.0-or-later header (decisions.md section 32). Reads the
      # whole tree, so it always runs; pinned to one stage because always_run makes a hook eligible
      # at every installed stage, and commit-msg is one of them.
      - id: check-license-headers
        name: licence headers
        entry: scripts/check-license-headers.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Dependency-change checks, and nothing more. Each runs the same make target make audit-deps
      # runs -- the Go one is the full source-aware scan over every package -- but only when the
      # dependency files themselves change, which is what limits them: they catch a bad upgrade at
      # the moment it is made, and nothing else. They do not catch an advisory published against a
      # dependency nobody touched since, and the Go one never fires on a .go change, so new code
      # reaching an already-vulnerable API goes unseen here. Widening the trigger is not the fix: it
      # would put a network scan on every Go commit. make audit-deps is the deliberate run, in the
      # CI audit job, the scheduled scan, the release and the health audit.
      - id: audit-deps-go
        name: go dependency audit
        entry: make audit-deps-go
        language: system
        pass_filenames: false
        require_serial: true
        files: ^go\.(mod|sum)$
      - id: audit-deps-web
        name: web dependency audit
        entry: make audit-deps-web
        language: system
        pass_filenames: false
        require_serial: true
        files: ^web/package(-lock)?\.json$
      # Compares the package map in backend.md section 1 against go list over the module: a package
      # with no row fails, a row ahead of its package is listed as planned. Always runs because a
      # package disappears by having its files deleted, and pre-commit passes no deleted paths.
      - id: check-package-map
        name: package map
        entry: scripts/check-package-map.sh
        language: system
        pass_filenames: false
        always_run: true
        # always_run makes a hook eligible at every installed stage, and commit-msg is one.
        stages: [pre-commit]
      # Always runs: the ratchet reads the whole tree and the staged diff, and a commit that
      # touches no source at all can still delete the baseline out from under it.
      - id: check-suppressions
        name: suppression ratchet
        entry: scripts/check-suppressions.sh
        language: system
        pass_filenames: false
        always_run: true
        # always_run makes this hook eligible at every installed stage, and commit-msg is one of
        # them; pinned so the whole-tree scan runs once.
        stages: [pre-commit]
      # Developer Certificate of Origin: every commit carries its author's Signed-off-by
      # (CONTRIBUTING.md). CI's signoff job checks pull requests again, for clones without hooks.
      - id: check-signoff
        name: DCO sign-off
        entry: scripts/check-signoff.sh
        language: system
        stages: [commit-msg]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
      - id: yamllint
        alias: yamllint-parsable
        name: "yamllint (parsable output)"
        args: ["--format", "parsable"]
        stages: [manual]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-fmt
      - id: golangci-lint-full
        types: [file]
        files: '(\.go$|^go\.(mod|sum)$|^\.golangci\.(yml|yaml|toml|json)$)'
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-test-repo-mod
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--force-scope"]
