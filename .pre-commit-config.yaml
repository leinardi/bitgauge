default_install_hook_types: [pre-commit, commit-msg]
# Hooks run at the pre-commit stage unless they say otherwise; only the commit-message check runs at
# commit-msg.
default_stages: [pre-commit]

# The upstream skills are vendored byte for byte: skills-lock.json records the hash of each folder
# as upstream ships it, so no hook may rewrite them (whitespace, end of file, markdown fixes). The
# skills this repository writes itself, beside them under .agents/skills, are linted as usual.
# The Claude Design export under docs/design_system is copied in as exported and is never
# hand-edited (docs/README.md, Provenance Rule), so it is excluded too, except features/: those are
# the spec pages the symlinks in docs/features point at, linted like any spec page.
exclude: '^(\.agents/skills/(fallow|vue-best-practices|vue-router-best-practices|vue-testing-best-practices)/|docs/design_system/(?!features/))'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
  # The offline link check: every relative link and #fragment in the Markdown resolves (lychee.toml
  # holds the trees it skips). The whole tree on every commit, because deleting a linked page
  # passes no file to the hook at all, so it takes its inputs from args: directories, walked with
  # .gitignore, unlike a glob, which lychee expands itself and which would read ignored files.
  # --hidden reaches .github, .agents, .claude and .serena, which the walk skips otherwise. The
  # walk does not follow the symlinks of docs/features into the design export (three pages and ui/),
  # so they are listed.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args:
          [
            "--config",
            "lychee.toml",
            "--offline",
            "--include-fragments",
            "--no-progress",
            "--hidden",
            "--extensions",
            "md",
            "--",
            ".",
            "docs/features/measurement.md",
            "docs/features/principles.md",
            "docs/features/product.md",
            "docs/features/ui",
          ]
        types: [markdown]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-shellcheck", "shellcheck -S error"]
      - id: actionlint
        alias: actionlint-oneline
        name: actionlint (one line per one error)
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-oneline", "-shellcheck", "shellcheck -S error"]
        stages: [manual]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        additional_dependencies:
          - markdownlint-rule-table-format@1.0.3
  # Pinned rather than taken from the system, so a developer machine and CI run the same release.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]
      - id: shellcheck
        alias: shellcheck-diff-output
        name: shellcheck (diff output)
        args: ["-f", "diff", "-x"]
        stages: [manual]
      - id: shellcheck
        alias: shellcheck-json-output
        name: shellcheck (json output)
        args: ["-f", "json", "-x"]
        stages: [manual]
  - repo: local
    hooks:
      - id: prettier-yaml
        name: prettier-yaml
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        files: \.(yml|yaml)$
        args: ["--write"]
      # The compose examples parse and resolve (docker compose config -q): the docker CLI only, no
      # daemon and no network. One file at a time, since -f twice would merge them.
      - id: compose-examples
        name: compose examples
        entry: bash -c 'for file in "$@"; do docker compose -f "$file" config -q || exit 1; done' --
        language: system
        files: ^deployments/examples/[^/]+/compose\.yaml$
        stages: [pre-commit]
      # Every source file carries the GPL-3.0-or-later header (decisions.md section 32). Reads the
      # whole tree, so it always runs; pinned to one stage because always_run makes a hook eligible
      # at every installed stage, and commit-msg is one of them.
      - id: check-license-headers
        name: license headers
        entry: scripts/check-license-headers.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Dead code in the web workspace. The binary is the exact version pinned in web/package.json,
      # resolved by npm from web/node_modules rather than taken off PATH: findings differ between
      # fallow releases, so a machine-local binary would gate against findings it never reported.
      # --no keeps npm from fetching one when the workspace has not been installed; the workspace
      # has to be installed (npm --prefix web ci) for this hook to mean what it says.
      #
      # Dead code only: duplication and complexity are not gated here. Expressed as --skip rather
      # than as the dead-code subcommand so the gate stays the default command's.
      #
      # No baseline: any finding fails the commit, so a fallow bump that reports a real finding
      # fails its Dependabot PR and a bump that does not merges untouched. Fix the finding, or
      # suppress it in place with a reasoned fallow-ignore comment.
      - id: web-fallow
        name: web fallow
        entry: npm --prefix web exec --no -- fallow --quiet --skip dupes --skip health
        language: system
        pass_filenames: false
        require_serial: true
        # Always runs: pre-commit drops deleted paths from the file list, so a commit that only
        # deletes files would otherwise never reach this hook, though deleting the last importer of
        # a file leaves that file dead.
        always_run: true
        # always_run makes a hook eligible at every installed stage, and commit-msg is one.
        stages: [pre-commit]
      # Dependency-change check, and nothing more: it runs the same make target make audit-deps
      # runs, but only when the web dependency files themselves change, so it catches a bad
      # upgrade at the moment it is made and nothing else. It does not catch an advisory published
      # against a dependency nobody touched since. make audit-deps is the deliberate run, in the CI
      # audit job, the scheduled scan, the release and the health audit; cargo-deny below is the
      # Rust counterpart.
      - id: audit-deps-web
        name: web dependency audit
        entry: make audit-deps-web
        language: system
        pass_filenames: false
        require_serial: true
        files: ^web/package(-lock)?\.json$
      # The SPA's API types are generated from the contract and committed (decisions.md section
      # 3). Regenerating them is the check: pre-commit fails a hook that changes a tracked file, so
      # a contract edit without its types, a hand edit of the types, or a generator bump that
      # changes its output all stop here. Needs the web workspace installed (npm --prefix web ci).
      - id: api-types-generate
        name: API types
        entry: make api-types
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(api/openapi\.yaml|web/src/api/types\.gen\.ts|web/package(-lock)?\.json)$
      # The web gates, each the npm script its make target runs (make web-lint, make web-test), on
      # the whole workspace rather than the staged files: a change to one module can break the
      # types or the tests of another. Need the web workspace installed (npm --prefix web ci).
      - id: web-eslint
        name: web eslint
        entry: npm --prefix web run lint
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(web/(src/.*\.(vue|ts|tsx)|e2e/.*\.ts|parity/.*\.ts|[^/]+\.config\.ts|package(-lock)?\.json))$
      - id: web-typecheck
        name: web typecheck
        entry: npm --prefix web run typecheck
        language: system
        pass_filenames: false
        require_serial: true
        files: ^web/(src/.*\.(vue|ts|tsx)|e2e/.*\.ts|parity/.*\.ts|[^/]+\.config\.ts|tsconfig.*\.json|package(-lock)?\.json)$
      - id: web-test
        name: web test
        entry: npm --prefix web run test
        language: system
        pass_filenames: false
        require_serial: true
        files: ^web/(src/.*\.(vue|ts|tsx)|vite\.config\.ts|package(-lock)?\.json)$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
      - id: yamllint
        alias: yamllint-parsable
        name: "yamllint (parsable output)"
        args: ["--format", "parsable"]
        stages: [manual]
  # Dockerfile Roast, built from source at this rev (language: rust), so every machine runs the
  # same release. Policy in droast.toml; its ShellCheck bridge is required and runs the
  # `shellcheck` on PATH, which CI pins with .github/actions/setup-shellcheck.
  - repo: https://github.com/immanuwell/dockerfile-roast
    rev: 1.7.0
    hooks:
      - id: droast
  - repo: local
    hooks:
      # The repository meta-tests (the meta crate) read dotfiles, workflows, Dockerfiles,
      # deployments, docs and the web configuration, and a commit that only deletes a file passes
      # no file at all, so no file filter would catch every input. They take a few seconds, so they
      # run on every commit.
      - id: meta-tests
        name: meta-tests
        entry: cargo test --locked -p meta
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  # The Rust workspace (docs/rust-port.md). The same commands make verify-rust runs (.mk/rust.mk), workspace-wide so the meta and testenv crates are
  # held to the same lints and tests as the server. clippy takes --all-features, so testenv's
  # Docker-only code is linted too; the tests do not, since those suites need Docker. The toolchain
  # comes from rust-toolchain.toml.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: '(\.rs$|^rustfmt\.toml$|^rust-toolchain\.toml$)'
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        require_serial: true
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)clippy\.toml$|^rust-toolchain\.toml$)'
      # The rust job's documentation check (make rust-doc), run before the commit rather than found
      # in CI: the docs of every crate and feature, warnings as errors, as the make target (a broken
      # or private intra-doc link fails it). Incremental, so a warm run takes seconds.
      - id: cargo-doc
        name: cargo doc
        entry: env RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --all-features --no-deps --locked
        language: system
        pass_filenames: false
        require_serial: true
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$)'
      # The Rust tests, meta-tests included. The meta-tests read the manifests, the lockfile,
      # deny.toml and the clippy configuration, so those trigger it too.
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --locked
        language: system
        pass_filenames: false
        require_serial: true
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)clippy\.toml$|^deny\.toml$|^rust-toolchain\.toml$)'
      # Dependency-change check, and nothing more: it fires when the dependency graph changes,
      # needs the network for the advisory database, and catches a bad upgrade at the moment it is
      # made. It does not catch an advisory published against a crate nobody touched since: the
      # rust CI job runs the same check on every pull request.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny --workspace check
        language: system
        pass_filenames: false
        require_serial: true
        files: '((^|/)Cargo\.(toml|lock)$|^deny\.toml$)'
      # The bans of the shipped binary's graph (deny-shipped.toml): the test crates, the shared
      # crates it does not ship and the client, filesystem and process features. Bans only, so it
      # needs no network (the rust job runs it).
      - id: cargo-deny-shipped
        name: cargo deny (shipped graph)
        entry: cargo deny --config deny-shipped.toml check bans
        language: system
        pass_filenames: false
        require_serial: true
        files: '((^|/)Cargo\.(toml|lock)$|^deny(-shipped)?\.toml$)'
  # Unused dependencies in every workspace member's Cargo.toml. Upstream triggers it on manifest
  # changes only; deleting the last use of a crate in a .rs file is what usually makes a
  # dependency unused, so Rust sources trigger it too.
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        types_or: [rust, cargo, cargo-lock]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--force-scope"]
