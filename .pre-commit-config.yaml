default_install_hook_types: [pre-commit, commit-msg]

# The upstream skills are vendored byte for byte: skills-lock.json records the hash of each folder
# as upstream ships it, so no hook may rewrite them (whitespace, end of file, markdown fixes). The
# skills this repository writes itself, beside them under .agents/skills, are linted as usual.
exclude: '^\.agents/skills/(create-adaptable-composable|fallow|vue-best-practices|vue-debug-guides|vue-router-best-practices|vue-testing-best-practices)/'

# Hooks for gates whose inputs do not exist yet (the API types, the frontend lint, typecheck and
# test hooks) are deliberately absent: each one lands in the commit that adds its inputs, and
# test/toolchain fails both when one is missing after that point and when one appears before.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-shellcheck", "shellcheck -S error"]
      - id: actionlint
        alias: actionlint-oneline
        name: actionlint (one line per one error)
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-oneline", "-shellcheck", "shellcheck -S error"]
        stages: [manual]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        additional_dependencies:
          - markdownlint-rule-table-format@1.0.3
  # Pinned rather than taken from the system, so a developer machine and CI run the same release.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]
      - id: shellcheck
        alias: shellcheck-diff-output
        name: shellcheck (diff output)
        args: ["-f", "diff", "-x"]
        stages: [manual]
      - id: shellcheck
        alias: shellcheck-json-output
        name: shellcheck (json output)
        args: ["-f", "json", "-x"]
        stages: [manual]
  - repo: local
    hooks:
      - id: prettier-yaml
        name: prettier-yaml
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        files: \.(yml|yaml)$
        args: ["--write"]
      # The offline documentation check (AGENTS.md validation matrix): relative links and their
      # fragments resolve, and the wire facts several pages state agree.
      # -count=1 because the file list comes from git ls-files, which the test cache cannot see;
      # always_run because deleting a linked page passes no file to the hook at all.
      - id: docs-links
        name: docs links and facts
        entry: go test -count=1 ./test/docs/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Every source file carries the GPL-3.0-or-later header (decisions.md section 32). Reads the
      # whole tree, so it always runs; pinned to one stage because always_run makes a hook eligible
      # at every installed stage, and commit-msg is one of them.
      - id: check-license-headers
        name: licence headers
        entry: scripts/check-license-headers.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Dead code in the web workspace. The binary is the exact version pinned in web/package.json,
      # resolved by npm from web/node_modules rather than taken off PATH: findings differ between
      # fallow releases, so a machine-local binary would gate against baselines it never wrote.
      # --no keeps npm from fetching one when the workspace has not been installed; the workspace
      # has to be installed (npm --prefix web ci) for this hook to mean what it says.
      #
      # Dead code only: duplication and complexity are not gated here. Expressed as --skip rather
      # than as the dead-code subcommand because --fail-on-regression fires on the default command.
      #
      # Two baselines, because they answer different questions. --baseline holds the findings
      # themselves, so an accepted one stays accepted and any other one fails whatever its
      # severity; --fail-on-regression compares the issue total left after that against the counts
      # baseline, which is why the counts file is saved with the findings baseline applied. Both
      # only ever forgive: a finding neither file covers fails the commit. Both start empty, and
      # are regenerated -- after a fallow bump, or to accept a reviewed finding -- with:
      #   npm --prefix web exec --no -- fallow --quiet --skip dupes --skip health
      #     --save-baseline .fallow-baseline.json
      #   npm --prefix web exec --no -- fallow --quiet --skip dupes --skip health
      #     --baseline .fallow-baseline.json
      #     --save-regression-baseline .fallow-regression-baseline.json
      - id: frontend-fallow
        name: frontend fallow
        entry: npm --prefix web exec --no -- fallow --quiet --skip dupes --skip health
          --baseline .fallow-baseline.json
          --fail-on-regression --regression-baseline .fallow-regression-baseline.json
        language: system
        pass_filenames: false
        require_serial: true
        # Always runs: pre-commit drops deleted paths from the file list, so a commit that only
        # removes a baseline would otherwise never reach this hook.
        always_run: true
        # always_run makes a hook eligible at every installed stage, and commit-msg is one.
        stages: [pre-commit]
      # Dependency-change checks, and nothing more. Each runs the same make target make audit-deps
      # runs -- the Go one is the full source-aware scan over every package -- but only when the
      # dependency files themselves change, which is what limits them: they catch a bad upgrade at
      # the moment it is made, and nothing else. They do not catch an advisory published against a
      # dependency nobody touched since, and the Go one never fires on a .go change, so new code
      # reaching an already-vulnerable API goes unseen here. Widening the trigger is not the fix: it
      # would put a network scan on every Go commit. make audit-deps is the deliberate run, in the
      # CI audit job, the scheduled scan, the release and the health audit.
      - id: audit-deps-go
        name: go dependency audit
        entry: make audit-deps-go
        language: system
        pass_filenames: false
        require_serial: true
        files: ^go\.(mod|sum)$
      - id: audit-deps-web
        name: web dependency audit
        entry: make audit-deps-web
        language: system
        pass_filenames: false
        require_serial: true
        files: ^web/package(-lock)?\.json$
      # Compares the package map in backend.md section 1 against go list over the module: a package
      # with no row fails, a row ahead of its package is listed as planned. Always runs because a
      # package disappears by having its files deleted, and pre-commit passes no deleted paths.
      - id: check-package-map
        name: package map
        entry: scripts/check-package-map.sh
        language: system
        pass_filenames: false
        always_run: true
        # always_run makes a hook eligible at every installed stage, and commit-msg is one.
        stages: [pre-commit]
      # Holds every production frontend file under the ceiling in .file-budgets, and each exempted
      # file at its committed line count, so an exemption can only shrink. Reads the whole tree
      # rather than a file list, and always runs because deleting a budgeted file leaves an entry
      # behind, and pre-commit drops deleted paths from the list.
      - id: check-file-budgets
        name: frontend file budgets
        entry: scripts/check-file-budgets.sh
        language: system
        pass_filenames: false
        always_run: true
        # always_run makes a hook eligible at every installed stage, and commit-msg is one.
        stages: [pre-commit]
      # Always runs: the ratchet reads the whole tree and the staged diff, and a commit that
      # touches no source at all can still delete the baseline out from under it.
      - id: check-suppressions
        name: suppression ratchet
        entry: scripts/check-suppressions.sh
        language: system
        pass_filenames: false
        always_run: true
        # always_run makes this hook eligible at every installed stage, and commit-msg is one of
        # them; pinned so the whole-tree scan runs once.
        stages: [pre-commit]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
      - id: yamllint
        alias: yamllint-parsable
        name: "yamllint (parsable output)"
        args: ["--format", "parsable"]
        stages: [manual]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-fmt
      - id: golangci-lint-full
        types: [file]
        files: '(\.go$|^go\.(mod|sum)$|^\.golangci\.(yml|yaml|toml|json)$)'
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-test-repo-mod
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--force-scope"]
