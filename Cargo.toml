# The Rust port of BitGauge (docs/rust-port.md), built beside the Go module until the cutover.

[workspace]
# Listed explicitly, never as a glob: meta/tests/lint_inheritance.rs checks each member's manifest.
members = [".", "meta", "testenv"]
resolver = "3"

[workspace.package]
edition = "2024"
# One exact Rust release, the one rust-toolchain.toml pins.
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
authors = ["Roberto Leinardi"]
repository = "https://github.com/leinardi/bitgauge"

# The lint set lives here once. Every member opts in with `[lints] workspace = true` (a member does
# not inherit it otherwise, and meta/tests/lint_inheritance.rs asserts that each one does).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Only `#[expect(lint, reason = "...")]` may silence a lint: it fails once the lint stops firing,
# and the reason is mandatory.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics outside tests; clippy.toml allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
# A match on an enum names every variant, so a new variant is a compile-time decision everywhere.
wildcard_enum_match_arm = "deny"
# Descriptive names; clippy's default allow-list applies.
min_ident_chars = "deny"
# The lint boundary (docs/rust-port.md): the lists live in each crate's nearest clippy.toml, and
# they are enforced only because these lints are denied. The root clippy.toml carries the
# production bans; the meta and testenv ones carry none.
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_types = "deny"

[package]
name = "bitgauge"
version = "0.0.0"
description = "Self-hosted, browser-based network speed test for LAN, homelab and VPN links"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bitgauge"
path = "src/main.rs"

# The server is hyper's HTTP/1 server on BitGauge's own accept loop and connection driver
# (docs/rust-port.md, Server Design): no client, no HTTP/2, no hyper-util graceful helper.
[dependencies]
bytes = "1.12.1"
http = "1.5.0"
http-body = "1.1.0"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# SIGTERM and SIGINT blocked and taken with sigwait on a thread of their own.
nix = { version = "0.30.1", default-features = false, features = ["signal"] }
pin-project-lite = "0.2.17"
serde = { version = "1.0.228", default-features = false, features = ["std"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
thiserror = "2.0.18"
tokio = { version = "1.54.1", default-features = false, features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
# CancellationToken (stop and cut) and the TaskTracker that owns every connection and socket task.
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tower-service = "0.3.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# The second-signal test sends its child the signals.
nix = { version = "0.30.1", default-features = false, features = ["process", "signal"] }
http-body-util = "0.1.5"
# The paused clock (start_paused) and the test I/O.
tokio = { version = "1.54.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }
# The test-only echo service's WebSocket, until the real one is ported (phase 10).
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
serde_json = "1.0.149"

# A second signal ends the process: a child process with the signals blocked in its only thread,
# so a plain main rather than libtest's threads.
[[test]]
name = "second_signal"
harness = false

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true

# The meta-tests scan the whole tree with regexes; unoptimized, regex compilation and matching
# dominate their run time. Only the regex crates are optimized in dev and test builds.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
