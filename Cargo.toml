# BitGauge's server, the shipped binary, and its test crates (meta, testenv).

[workspace]
# Listed explicitly, never as a glob: meta/tests/lint_inheritance.rs checks each member's manifest.
members = [".", "meta", "testenv"]
resolver = "3"

[workspace.package]
edition = "2024"
# One exact Rust release, the one rust-toolchain.toml pins.
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
authors = ["Roberto Leinardi"]
repository = "https://github.com/leinardi/bitgauge"

# The crates shared with the other Rust projects, from leinardi/rust-common: a git dependency
# pinned by `rev`, the upstream-stack commit (B6 moves it to the release tag with `version`, whose
# `<major>.<minor>` keeps cargo-deny's `wildcards = "deny"` satisfied). To move the pin, change the
# `rev` on every rust-common line and run `cargo fetch` (not `cargo update -p`); `git diff
# Cargo.lock` must touch
# only the rust-common packages' lines. Each member opts in with `<name>.workspace = true` and its
# own features. Local work on both repositories: an uncommitted
# `[patch."https://github.com/leinardi/rust-common"]` table naming each crate with
# `path = "../rust-common/crates/<name>"`, never in a release or image build (its paths are not
# remapped, and the image's build context does not hold them).
[workspace.dependencies]
repo-meta = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }
service-kit = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }
testenv-core = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }
tracing-setup = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }

# The lint set lives here once. Every member opts in with `[lints] workspace = true` (a member does
# not inherit it otherwise, and meta/tests/lint_inheritance.rs asserts that each one does).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Only `#[expect(lint, reason = "...")]` may silence a lint: it fails once the lint stops firing,
# and the reason is mandatory.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics outside tests; clippy.toml allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
# A match on an enum names every variant, so a new variant is a compile-time decision everywhere.
wildcard_enum_match_arm = "deny"
# Descriptive names; clippy's default allow-list applies.
min_ident_chars = "deny"
# The lint boundary (docs/rust-port.md): the lists live in each crate's nearest clippy.toml, and
# they are enforced only because these lints are denied. The root clippy.toml carries the
# production bans; the meta and testenv ones carry none.
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_types = "deny"

[package]
name = "bitgauge"
version = "0.0.0"
description = "Self-hosted, browser-based network speed test for LAN, homelab and VPN links"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bitgauge"
path = "src/main.rs"

# The server is service-kit's HTTP/1 server on hyper (docs/rust-port.md, Server Design): no
# client, no HTTP/2.
[dependencies]
# The logger's subscriber: tracing-subscriber's text or flat JSON, no ANSI, UTC timestamps
# (rust-common); the log settings are parsed here.
tracing-setup.workspace = true
# The build stamps' reads, `buildinfo!`, and the HTTP/1 server (rust-common, feature `http`: accept
# loop, connection driver, head and write-stall deadlines, drain and cut). The signals stay
# BitGauge's own.
service-kit = { workspace = true, features = ["http"] }
# The router and the handlers' request and response body; MatchedPath labels the metrics.
axum = { version = "0.8.9", default-features = false, features = ["matched-path"] }
bytes = "1.12.1"
# The command line, behind an argument pre-scan; no color or suggestions.
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
# The WebSocket's stream and sink.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# The random buffer and the epoch, read once at startup.
getrandom = "0.4.3"
http = "1.5.0"
http-body = "1.1.0"
# The metrics endpoint's whole-body response.
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
# The built SPA, web/dist, embedded in the binary.
include_dir = "0.7.4"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# SIGTERM and SIGINT blocked and taken with sigwait on a thread of their own; an IPv6 zone named
# by its interface (if_nametoindex).
nix = { version = "0.30.1", default-features = false, features = ["net", "signal"] }
pin-project-lite = "0.2.17"
# The metric set of backend.md section 7, written as OpenMetrics text.
prometheus-client = { version = "0.25.2", default-features = false }
# index.html rendered once at startup: the base-path meta element and the relative asset URLs.
regex = { version = "1.13.1", default-features = false, features = ["std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
# The JSON bodies, written through a formatter that matches encoding/json.
serde_json = { version = "1.0.154", default-features = false, features = ["raw_value", "std"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
thiserror = "2.0.18"
# The WebSocket echo on hyper's upgraded connection; the handshake is checked by hand.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio = { version = "1.54.1", default-features = false, features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
# CancellationToken (stop and cut) and the TaskTracker that owns every connection and socket task.
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tower-service = "0.3.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# MakeWriter, the bound of the logger's writers.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
# The server tests' HTTP/1 client on a loopback connection.
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
# The second-signal test sends its child the signals; the listener-failure test shuts a
# listening socket down.
nix = { version = "0.30.1", default-features = false, features = ["net", "process", "signal", "socket"] }
# Capture, the writer the unit tests log into.
tracing-setup = { workspace = true, features = ["testing"] }
# The paused clock (start_paused) and the test I/O.
tokio = { version = "1.54.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }

# A second signal ends the process: a child process with the signals blocked in its only thread,
# so a plain main rather than libtest's threads.
[[test]]
name = "second_signal"
harness = false

# The server through command::run in process mode, in child processes for the same reason.
[[test]]
name = "process_mode"
harness = false

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true

# make run's binary (.mk/run.mk): optimized like the release, so a speed test still measures the
# network, but without the release's fat LTO and single codegen unit, and incremental, so a rebuild
# after an edit takes seconds rather than half a minute. Never shipped.
[profile.dist-local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Line tables only for the workspace and no debug info for the dependencies: backtraces keep
# their files and lines, and the debug and test binaries shrink to a fraction of their size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The meta-tests scan the whole tree with regexes; unoptimized, regex compilation and matching
# dominate their run time. Only the regex crates are optimized in dev and test builds.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
