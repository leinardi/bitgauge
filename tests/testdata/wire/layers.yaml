# The wire corpus: every layer, the metrics endpoint, CORS and a label.
server:
  display_name: Wire Corpus
  public_url: https://speed.example.org
  cors:
    allowed_origins:
      - https://app.example.org
  labels:
    - cidr: 127.0.0.0/8
      label: Loopback lab
compat:
  openspeedtest:
    enabled: true
  librespeed:
    enabled: true
  networkquality:
    enabled: true
metrics:
  enabled: true
